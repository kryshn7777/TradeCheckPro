<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="{{GAME_PATH}}icons/icon-192.png" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #08090a; color: #ddd5c4; font: 17px/1.65 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 24px 16px 64px; }
      main { max-width: 720px; margin: 0 auto; }
      h1 { font: 600 30px/1.2 Georgia, 'Times New Roman', serif; letter-spacing: 0.06em; color: #e8dcc0; margin: 24px 0 8px; }
      h2 { font: 600 20px/1.3 Georgia, 'Times New Roman', serif; color: #e0a050; margin: 32px 0 6px; }
      p, li { color: #cfc7b6; }
      table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 15px; }
      th, td { border: 1px solid #30363a; padding: 8px 10px; text-align: left; vertical-align: top; }
      th { background: #141718; color: #e8dcc0; }
      a { color: #e0a050; }
      code { background: #141718; padding: 1px 5px; border-radius: 3px; }
      nav { margin-bottom: 8px; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="../">Abyssal Tether</a></nav>
      {{CONTENT}}
    </main>
  </body>
</html>
